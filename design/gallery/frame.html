<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>WARRANT gallery frame</title>
<!-- Devpost gallery image, 1800x1200 (3:2). A real screenshot of the live app
     on a paper plate, with a numbered caption in the landing page's
     ultramarine. ?n=1&title=...&sub=...&img=shot.png -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500&family=Space+Mono:wght@400;700&display=swap">
<style>
  html,body{margin:0}
  .f{width:1800px;height:1200px;box-sizing:border-box;padding:56px 72px 64px;display:grid;grid-template-rows:auto 1fr;gap:34px;
    background:radial-gradient(circle at 82% 8%,#3B5CBA 0,#2D4AA0 50%);color:#F4EEDD;font:400 24px/1.4 "Work Sans",sans-serif;position:relative;overflow:hidden}
  .stars{position:absolute;inset:0;opacity:.45;pointer-events:none;
    background-image:radial-gradient(1.5px 1.5px at 12% 14%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 88% 30%,#fff 50%,transparent 51%),
    radial-gradient(2px 2px at 64% 6%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 40% 9%,#fff 50%,transparent 51%)}
  header{display:grid;grid-template-columns:auto 1fr auto;gap:28px;align-items:start;position:relative}
  .n{font:italic 500 88px/.8 "Cormorant Garamond",serif;color:#F0CF7A;margin-top:4px}
  h1{margin:0;font:500 54px/1.02 "Cormorant Garamond",serif;letter-spacing:-.01em}
  h1 em{color:#F0CF7A}
  p{margin:10px 0 0;color:#E9E1CB;font-size:24px;max-width:1150px}
  .brand{display:flex;align-items:center;gap:12px;font:700 18px/1 "Space Mono",monospace;letter-spacing:.3em;align-self:start}
  .plate{position:relative;background:#F6F1E4;border-radius:10px;padding:14px;box-shadow:0 30px 60px -30px rgba(10,16,40,.7);min-height:0;display:flex}
  .plate img{width:100%;height:100%;object-fit:cover;object-position:top left;border-radius:4px;display:block}
</style></head><body>
<div class="f">
  <div class="stars"></div>
  <header>
    <span class="n" id="n"></span>
    <div><h1 id="t"></h1><p id="s"></p></div>
    <div class="brand"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="none" stroke="#F4EEDD" stroke-width="1.5"/><ellipse cx="15" cy="15" rx="13" ry="5" fill="none" stroke="#E2B655" stroke-width="1.5" transform="rotate(-25 15 15)"/><circle cx="15" cy="15" r="4" fill="#F4EEDD"/></svg>WARRANT</div>
  </header>
  <div class="plate"><img id="i" alt=""></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById("n").textContent = q.get("n") || "";
  document.getElementById("t").innerHTML = q.get("title") || "";
  document.getElementById("s").textContent = q.get("sub") || "";
  const i = document.getElementById("i"); i.src = q.get("img"); i.alt = q.get("alt") || "";
  if (q.get("pos")) i.style.objectPosition = q.get("pos");
</script>
</body></html>
