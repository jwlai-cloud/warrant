# WARRANT runtime configuration.
#
# The ONLY thing that changes between "self-hosted vLLM" and "Token Factory"
# is the `kind` + `base_url` + `model` of a tier below. There is one code path.
#
# kind: vllm | token_factory | mock
#   vllm          -> OpenAI-compatible server you run (Nebius GPU Serverless Endpoint)
#   token_factory -> Nebius Token Factory inference API
#   mock          -> deterministic stub; no network, used by tests and offline dev

tiers:
  # Fast path: entity classification + the common allow case.
  # Small model, tight reasoning budget. Sovereign by default.
  # Managed by default so the demo works with no GPU running. Switch `kind` to
  # vllm and point base_url at a Nebius GPU Serverless Endpoint to self-host the
  # same model - that is the entire change (ADR-0002).
  fast:
    kind: token_factory
    base_url: ${WARRANT_TF_BASE_URL}
    api_key: ${WARRANT_TF_API_KEY}
    model: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B
    reasoning_budget: 64
    timeout_s: 60

  # Deep path: contested decisions and justification narratives that need
  # real reasoning over the architecture model.
  deep:
    kind: token_factory
    base_url: ${WARRANT_TF_BASE_URL}
    api_key: ${WARRANT_TF_API_KEY}
    model: nvidia/nemotron-3-super-120b-a12b
    reasoning_budget: 512
    timeout_s: 120

  # Review path: the Steward Agent's recommendation on a grant request. Rare
  # (only after a refusal the agent escalates) and the highest-stakes call in
  # the system, since a person decides on the back of it - so the largest
  # Nemotron. On a real request it ran faster than Super (2.7-3.9s vs 5.2s,
  # fewer reasoning tokens) and recommended consistently.
  review:
    kind: token_factory
    base_url: ${WARRANT_TF_BASE_URL}
    api_key: ${WARRANT_TF_API_KEY}
    model: nvidia/Nemotron-3-Ultra-550b-a55b
    reasoning_budget: 512
    timeout_s: 120

# If a tier is unreachable (e.g. the GPU endpoint is stopped to save money),
# fall through to this tier instead of failing. Set to null to fail hard.
fallback:
  fast: deep
  review: deep
  deep: null

# ---- THIS IS THE DEMO PROFILE. It is deliberately open. ----
#
# Both controls below default to their SECURE value in code (config.py), so a
# profile that omits them is locked down. This file turns them off on purpose,
# because the whole point of it is a URL a judge can open and press buttons on.
#
#   agent_auth: disabled -> POST /v1/warrant trusts `caller_agent` from the
#                           request body. Any client can therefore request a
#                           warrant AS any agent. Set to `required` and fill in
#                           agent_tokens below for anything that is not a demo.
#   demo_mode:  true     -> registers /v1/demo/run and /v1/demo/reset. Reset
#                           DELETES the audit log and the approvals store, and
#                           the audit log is also the warrant store, so reset
#                           revokes every live warrant. It is unauthenticated.
#
# A real deployment deletes these two lines (inheriting the secure defaults) and
# populates agent_tokens:
#
#   agent_tokens:
#     "${WARRANT_AUDITOR_TOKEN}": expense-auditor
#
agent_auth: disabled
demo_mode: true

model_dir: config/model
audit_path: ${WARRANT_AUDIT_PATH}
