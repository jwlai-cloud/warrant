# The authorization model. A grant lets a capability reach a data entity.
# Absence of a grant is a denial - WARRANT is fail-closed by construction.
grants:
  - capability: expense-management
    data_entity: Expense.Claim
    granted_by: cfo@example.com
    note: Own capability, own data.

  - capability: expense-management
    data_entity: Supplier.Contract
    granted_by: coo@example.com
    note: Cross-org grant - Finance may verify spend against supplier terms.

  - capability: expense-management
    data_entity: Inventory.StockLevel
    granted_by: coo@example.com
    note: >-
      Cross-org grant. Finance may check claims against stock movements.
      This grant is what makes the A/B demo work: within the Inventory
      Reconciler's declared set, Employee.Compensation is now the ONLY
      entity Expense Management cannot reach. So the outcome turns on a
      single classification question - does this purpose need salary data?

  - capability: inventory-control
    data_entity: Inventory.StockLevel
    granted_by: coo@example.com

  - capability: inventory-control
    data_entity: Supplier.Contract
    granted_by: coo@example.com

  - capability: workforce-planning
    data_entity: Employee.Roster
    granted_by: chro@example.com

# Deliberately absent, and the demo turns on it:
#   inventory-control -> Employee.Compensation
# The Inventory Reconciler reads Employee.Compensation, but no org has granted
# Inventory Control access to it. Every call that touches it is refused.
