# Offline profile - no GPU, no credits, no network. Used by tests, CI and the
# first five minutes of any new contributor's day.
tiers:
  fast: { kind: mock, model: mock-nano }
  deep: { kind: mock, model: mock-super }
fallback: { fast: deep, deep: null }
# This profile is for tests, CI and offline development, so both controls are
# switched off deliberately. Anything hosted must not use this file.
agent_auth: disabled
demo_mode: true

model_dir: config/model
# Its own store. Sharing audit/warrant.jsonl with the live profile meant that
# running the demo once and approving a grant turned the test suite red: the
# approval was replayed into the model the offline tests authorize against.
audit_path: audit/offline/warrant.jsonl
