[project]
name = "warrant"
version = "0.1.0"
description = "An authorization plane for agent-to-agent calls that decides from your enterprise architecture model - and returns the reason."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.9",
]

[project.optional-dependencies]
# LangGraph is for the agents only. warrant.engine and warrant.providers import
# no agent framework - that layering rule is what keeps the authorization plane
# callable from any framework (ADR-0005, kept by ADR-0008), and
# tests/test_no_bypass.py fails if an agent module reaches past the seam.
agents = ["langgraph>=1.2"]
# mcp 2.x: FastMCP was renamed MCPServer and the API moved. Pinned to the major
# so v1 examples from memory or old docs fail loudly rather than subtly.
mcp = ["mcp>=2.2,<3"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "langgraph>=1.2",
       "mcp>=2.2,<3"]

[project.scripts]
warrant = "warrant.cli:app"
warrant-mcp = "warrant.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
